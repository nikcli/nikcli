name = "nikcli-web"
main = "./dist/_worker.js"
compatibility_date = "2025-01-25"

[vars]
NIKCLI_AUTH_SERVER = "https://s.nikcli-ai.dev"
# Docs support assistant (/api/docs-assistant). Any Workers AI text-generation
# model works. Workers AI includes 10,000 free Neurons/day, so the default is a
# small "fast" model that keeps a grounded answer (~5k input + ~500 output
# tokens) cheap enough for hundreds of questions per day.
#   @cf/meta/llama-3.2-3b-instruct          — cheapest, still coherent
#   @cf/meta/llama-3.1-8b-instruct-fast     — default: best quality/cost balance
#   @cf/meta/llama-3.3-70b-instruct-fp8-fast — best answers, ~6x the Neurons
DOCS_ASSISTANT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
# Questions that ask for something buildable (a cheatsheet, a UI, a diagram)
# get a stronger model: it writes valid CSS and real interactive HTML, and is
# still covered by the free allocation because those questions are rarer.
DOCS_ASSISTANT_ARTIFACT_MODEL = "@cf/openai/gpt-oss-20b"
DOCS_ASSISTANT_RATE_LIMIT = "20"
# Aggregate gateway-usage feed behind /data, served by the console deployment
# (packages/console/app/src/routes/data.json.ts). Only aggregates cross this
# link, so the site never holds database credentials. Unset or unreachable,
# /data renders its "nothing published yet" state instead of failing.
CONSOLE_DATA_URL = "https://nikcli-ai.dev/data.json"
# What installs report running on their own provider keys — the models that
# never touch the gateway, and most of what nikcli actually runs. Opt-in at the
# CLI (`analytics.share`), aggregated by the inference dashboard.
COMMUNITY_DATA_URL = "https://dashboard.nikcli-ai.dev/api/community.json"
# Artifacts published by the assistant always share under this origin.
ARTIFACT_PUBLIC_ORIGIN = "https://nikcli-ai.dev"
# Optional: back the docs assistant with a real nikcli session instead of a
# one-shot Workers AI call. Set NIKCLI_DOCS_SERVER here and the token as a
# secret (`wrangler secret put NIKCLI_DOCS_TOKEN`). Unset = free Workers AI.
# NIKCLI_DOCS_SERVER = "https://s.nikcli-ai.dev"
# NIKCLI_DOCS_AGENT = "docs-support"

# Workers AI — powers the docs support assistant. Always runs against the real
# Cloudflare service, including under `wrangler dev`, which has no local model.
[ai]
binding = "AI"
remote = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Prerendered docs pages are served straight from /docs/<page>, the URL the
# sidebar, canonical tags and og:url already use. Without this, the default
# handling redirects every one of them to a trailing slash.
html_handling = "drop-trailing-slash"

[[kv_namespaces]]
binding = "SESSIONS"
id = "e9dfbfcd44c14909b03cef0629b4f80f"

[[kv_namespaces]]
binding = "USERS"
id = "bb2d5e50ff1644b482c71b7355a7684c"

# Published artifacts (nikcli-ai.dev/artifact/:id) — content + metadata.
# Create the bucket once with: wrangler r2 bucket create nikcli-artifact
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "nikcli-artifact"

# Per-country download counts, written by /releases/download/* — the URL both
# installers already fetch from. GitHub and npm publish download totals with no
# geography at all, so this is the only place the country behind a download
# exists; /data reads it for the geographic breakdown.
# Schema lives in ./d1-migrations; apply it with:
#   bun run --cwd packages/web d1:migrate:remote
[[d1_databases]]
binding = "DOWNLOADS"
database_name = "nikcli-web"
database_id = "0f603451-f624-46fa-8597-e581a68828c1"
migrations_dir = "./d1-migrations"
