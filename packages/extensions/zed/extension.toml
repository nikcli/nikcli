cmd = "./nikcli"
args = ["acp"]

[agent_servers.nikcli.targets.linux-x86_64]
archive = "https://github.com/nikomatt69/nikcli/releases/download/v1.362.0/nikcli-linux-x64.tar.gz"
cmd = "./nikcli"
args = ["acp"]

[agent_servers.nikcli.targets.windows-x86_64]
