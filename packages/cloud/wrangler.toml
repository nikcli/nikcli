name = "nikcli-cloud"
main = "src/index.ts"
compatibility_date = "2025-01-25"
compatibility_flags = ["nodejs_compat"]

[vars]
AUTH_ISSUER = "https://auth.nikcli-ai.dev"
AUTH_AUDIENCE = "nikcli-cloud"
# AUTH_JWKS_URL = "https://auth.nikcli-ai.dev/.well-known/jwks.json"
# AUTH_JWT_SECRET = "set-via-wrangler-secret"

[[d1_databases]]
binding = "DB"
database_name = "nikcli-cloud"
database_id = "00000000-0000-0000-0000-000000000000"

[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_classes = ["RelayRoom"]
