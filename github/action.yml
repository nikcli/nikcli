name: "nikcli GitHub Action"
description: "Run nikcli in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the nikcli session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of Nikcli App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/nikcli,/nik'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.nikcli-ai.dev"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ github.action_path }}/../package.json

    - name: Install action dependencies
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
      run: bun install --cwd "$ACTION_ROOT" --frozen-lockfile

    - name: Run nikcli
      shell: bash
      id: run_nikcli
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        TOKEN: ${{ inputs.use_github_token == 'true' && github.token || '' }}
        GITHUB_TOKEN: ${{ inputs.use_github_token == 'true' && github.token || '' }}
        GH_TOKEN: ${{ inputs.use_github_token == 'true' && github.token || '' }}
      run: bun "$GITHUB_ACTION_PATH/index.ts"
