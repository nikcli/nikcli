name: nikcli-site-deploy

on:
  push:
    branches:
      - live-main
      - production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'nikcli/nikcli'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `sst deploy` runs the whole app — infra/app.ts, infra/console.ts and
      # infra/enterprise.ts — and the console half declares Stripe resources, so
      # the Stripe provider needs a key even for a site-only change. Without one
      # the deploy fails as `StripeWebhookEndpoint ... api_key is required`,
      # which names a resource rather than the missing repository secret. Check
      # the credentials up front and say which one is absent.
      - name: Verify deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN STRIPE_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}. Set them with 'gh secret set <NAME>' — sst.config.ts reads each one as a provider credential and the deploy cannot authenticate without it."
            exit 1
          fi

      - name: Deploy nikcli site with SST
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/sst-deploy.log"

          if bun sst deploy --stage="${{ github.ref_name }}" 2>&1 | tee "$log"; then
            exit 0
          fi

          # SST persists a lock when an update is interrupted. GitHub's
          # concurrency group serializes deployments for this stage, so a lock
          # reported after this deployment starts is stale and can be removed.
          if ! grep -Fq "A concurrent update was detected" "$log"; then
            exit 1
          fi

          echo "::warning::Removing stale SST deployment lock and retrying"
          bun sst unlock --stage="${{ github.ref_name }}"
          bun sst deploy --stage="${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
