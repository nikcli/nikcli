name: devhub-checks

# What a change to DevHub has to pass, on every platform it ships for.
#
#   frontend  typecheck, unit tests, formatting and the production web build (Linux)
#   native    the Rust side (formatting on Linux, tests everywhere) and the web build, which
#             Tauri embeds, on Linux, macOS and Windows
#
# Bundles are not built here: `devhub-release` builds them on every platform and publishes
# nothing unless all of them succeed. It also calls this workflow on the exact commit it is
# about to tag, so nothing red is ever released.
on:
  push:
    branches: [live-main]
    paths:
      - "packages/devhub/**"
      - ".github/workflows/devhub-*.yml"
  pull_request:
    paths:
      - "packages/devhub/**"
      - ".github/workflows/devhub-*.yml"
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: false
        type: string
        default: ""
  workflow_dispatch:

concurrency:
  group: devhub-checks-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/live-main' }}

permissions:
  contents: read

jobs:
  frontend:
    if: github.repository == 'nikcli/nikcli' || github.repository == 'nikomatt69/nikcli'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        working-directory: packages/devhub
        run: bun run typecheck

      - name: Unit tests
        working-directory: packages/devhub
        run: bun test src

      - name: Formatting
        run: bun run prettier --check "packages/devhub/src/**/*.{ts,tsx,css}" packages/devhub/package.json packages/devhub/tsconfig.json packages/devhub/vite.config.ts

      - name: Web build
        working-directory: packages/devhub
        run: bun x vite build

  native:
    if: github.repository == 'nikcli/nikcli' || github.repository == 'nikomatt69/nikcli'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev build-essential file

      - uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/devhub/src-tauri -> target
          key: checks-${{ matrix.os }}

      # Tauri embeds `dist` at compile time, so the Rust build needs it first. Built outside
      # Tauri's beforeBuildCommand, which can pick up a broken bun shim on Windows.
      - name: Build frontend
        working-directory: packages/devhub
        shell: bash
        run: bun x vite build

      - name: Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path packages/devhub/src-tauri/Cargo.toml --check

      - name: Rust tests
        run: cargo test --manifest-path packages/devhub/src-tauri/Cargo.toml
