name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  workflow_call:
    inputs:
      bump:
        description: "Bump type"
        required: false
        type: string
      version:
        description: "Override version"
        required: false
        type: string
      channel:
        description: "Channel"
        required: false
        type: string
      prevalidated:
        description: "The calling workflow already completed ci-pipeline validation"
        required: false
        type: boolean
        default: false
    outputs:
      tag:
        description: "Release tag created by the publish job (e.g. v1.106.0)"
        value: ${{ jobs.publish.outputs.tag }}
      version:
        description: "Released version (e.g. 1.106.0)"
        value: ${{ jobs.publish.outputs.version }}
      run_id:
        description: "GitHub Actions run ID that produced the nikcli-cli artifact (downstream jobs use it to download the prebuilt CLI via `gh run download`)"
        value: ${{ jobs.publish.outputs.run_id }}
  push:
    branches:
      - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      (github.repository == 'nikomatt69/nikcli' || github.repository == 'nikcli/nikcli') &&
      (github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, 'release: v') &&
      !startsWith(github.event.head_commit.message, 'chore: generate') &&
      !contains(github.event.head_commit.message, '[nikcli autofix]')))
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: ./.github/actions/setup-bun

      - name: Validate direct publish
        if: ${{ !inputs.prevalidated }}
        env:
          NIKCLI_TEST_HOME: ${{ runner.temp }}/nikcli-publish/home
          XDG_DATA_HOME: ${{ runner.temp }}/nikcli-publish/share
          XDG_CACHE_HOME: ${{ runner.temp }}/nikcli-publish/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/nikcli-publish/config
          XDG_STATE_HOME: ${{ runner.temp }}/nikcli-publish/state
          NIKCLI_DISABLE_MODELS_FETCH: "true"
          NIKCLI_DISABLE_SHARE: "true"
          NIKCLI_DISABLE_LSP_DOWNLOAD: "true"
          NIKCLI_DISABLE_DEFAULT_PLUGINS: "true"
          NIKCLI_DISABLE_AUTOUPDATE: "true"
          NIKCLI_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
        run: bun run script/ci-validate.ts

      - name: Install nikcli
        if: inputs.bump || inputs.version
        run: bun i -g nikcli-ai@latest || true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Setup Git Identity
        run: |
          git config --global user.email "nikcli-ci@users.noreply.github.com"
          git config --global user.name "nikcli"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      # bun 1.4's `--compile` emits darwin binaries whose ad-hoc signature macOS
      # rejects at exec (SIGKILL, "killed: 9"). The build re-signs them, and this
      # ubuntu runner has no `codesign`, so give it rcodesign instead.
      - name: Install rcodesign
        run: |
          curl -fsSL -o /tmp/rcodesign.tar.gz \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp
          install -m 0755 /tmp/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/rcodesign
          rcodesign --version

      - name: Generate SDK
        run: ./script/generate.ts

      - name: Publish
        id: publish
        run: ./script/publish-start.ts
        env:
          NIKCLI_BUMP: ${{ inputs.bump || '' }}
          NIKCLI_CHANNEL: ${{ inputs.channel || '' }}
          NIKCLI_VERSION: ${{ inputs.version }}
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: false

      # Only the compiled per-target binaries are consumed downstream (the desktop
      # build's `prepare:sidecar`). Uploading the whole `dist` also bundled the
      # release `.zip`/`.tar.gz` archives and `bun pm pack` `.tgz` tarballs for
      # every variant (~GBs), which then filled the small desktop runners' disks
      # while extracting the artifact (`no space left on device`). Ship just the
      # `bin/` payloads — the artifact root stays `<variant>/bin/nikcli`.
      - uses: actions/upload-artifact@v7
        with:
          name: nikcli-cli
          path: packages/nikcli/dist/*/bin/**

    outputs:
      release: ${{ steps.publish.outputs.release }}
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}
      run_id: ${{ github.run_id }}

  publish-release:
    needs:
      - publish
    if: always() && needs.publish.result == 'success' && needs.publish.outputs.tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.publish.outputs.tag }}

      - uses: ./.github/actions/setup-bun

      - run: ./script/publish-complete.ts
        env:
          NIKCLI_VERSION: ${{ needs.publish.outputs.version  }}
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
