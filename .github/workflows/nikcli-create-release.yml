name: nikcli-create-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.8)"
        required: true
        type: string

concurrency:
  group: nikcli-create-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: (github.repository == 'nikomatt69/nikcli' || github.repository == 'nikcli/nikcli')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SST_GITHUB_TOKEN }}

      - run: git fetch --force --tags

      - uses: ./.github/actions/setup-bun

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build nikcli binaries
        working-directory: packages/nikcli
        run: bun run build

      - name: Create archives
        working-directory: packages/nikcli
        env:
          COPYFILE_DISABLE: "1"
        run: |
          DIST="$(pwd)/dist"
          for src in "$DIST"/*/; do
            name=$(basename "$src")
            if echo "$name" | grep -q "linux"; then
              tar --format=ustar --no-xattrs --exclude='._*' --exclude='.DS_Store' -czf "${DIST}/${name}.tar.gz" -C "$DIST" "$name"
              echo "created: ${name}.tar.gz"
            elif echo "$name" | grep -qE "windows|darwin"; then
              (cd "$DIST" && zip -Xrq "${name}.zip" "$name" -x '*/._*' '*/.DS_Store')
              echo "created: ${name}.zip"
            fi
          done

      - name: Build changelog notes
        id: notes
        run: |
          PREV=$(gh release list --limit 2 --json tagName --jq '.[1].tagName // ""')
          TAG="${{ steps.tag.outputs.value }}"
          if [ -n "$PREV" ]; then
            NOTES=$(git log --oneline "${PREV}..HEAD" --pretty=format:"- %s" 2>/dev/null || echo "Release ${TAG}")
          else
            NOTES="Release ${TAG}"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo ""
            echo "## Installing the desktop app"
            echo ""
            echo "Desktop builds are not signed with a paid Apple/Windows certificate, so the OS shows a one-time warning on a freshly downloaded app. This is expected — the app is safe to run."
            echo ""
            echo "- **macOS** — right-click (Control-click) the app → **Open** → **Open**. If macOS says it is \"damaged\", run once: \`xattr -dr com.apple.quarantine /Applications/Nikcli.app\`"
            echo "- **Windows** — if SmartScreen appears (\"Windows protected your PC\"), click **More info → Run anyway**."
            echo "- **Linux** — install the downloaded \`.deb\` or \`.rpm\` package directly."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}

      - name: Create GitHub release
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          DIST="packages/nikcli/dist"
          mapfile -t FILES < <(find "$DIST" -maxdepth 1 \( -name "*.tar.gz" -o -name "*.zip" \))

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists; uploading assets only"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "${{ steps.notes.outputs.notes }}" \
              --draft \
              "${FILES[@]}"
            echo "Draft release $TAG created"
          fi
        env:
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
