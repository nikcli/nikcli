name: desktop-release

# Builds the Tauri desktop apps (Nikcli) for every platform with `bun run tauri
# build` and uploads the installers to the GitHub release — mirroring the way the
# CLI binaries are attached. When a Tauri signing key is configured it also builds
# the auto-updater artifacts and publishes a Tauri `latest.json` manifest (the
# Tauri equivalent of electron-builder's latest*.yml feeds).
#
# Separate from ci-pipeline, but triggered by it (reusable workflow) after publish.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach desktop artifacts to (e.g. v1.106.0)"
        required: true
        type: string
      cli_run_id:
        description: "GitHub Actions run ID of the publish job that produced the prebuilt `nikcli-cli` artifact (used by `bun run prepare:sidecar` to download the sidecar instead of rebuilding it)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach desktop artifacts to (e.g. v1.106.0)"
        required: true
        type: string
      cli_run_id:
        description: "GitHub Actions run ID of the publish job that produced the prebuilt `nikcli-cli` artifact"
        required: false
        type: string
        default: ""

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: (github.repository == 'nikomatt69/nikcli' || github.repository == 'nikcli/nikcli')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # x86_64 is cross-compiled on the Apple Silicon runner: GitHub's Intel
          # `macos-13` image is being retired and its runners are scarce (jobs sit
          # queued for ~hours, then get cancelled, taking finalize-updater with
          # them). macos-14 + the x86_64 Rust target builds a valid Intel bundle.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # The hosted Linux runners ship with only ~14 GB free on `/`. Between the
      # Rust toolchain/cache, the downloaded CLI sidecar artifact and the Tauri
      # build output that fills up (`no space left on device`). Reclaim the
      # preinstalled SDKs we don't use before building.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            rpm

      - uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      # Prepare the sidecar + frontend in a plain step instead of via Tauri's
      # `beforeBuildCommand`. Tauri runs that command with `node_modules/.bin` on
      # PATH, so on Windows `bun` resolves to a hoisted-linker bin shim that's
      # broken (`could not create process / Bun failed to remap this bin`). Run
      # here, where `bun` is the global toolchain binary, then skip Tauri's
      # beforeBuildCommand below.
      - name: Prepare sidecar & frontend
        working-directory: packages/desktop
        shell: bash
        env:
          CLI_ARTIFACT_RUN_ID: ${{ inputs.cli_run_id }}
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${{ inputs.tag }}"
          RELEASE_VERSION="${RELEASE_VERSION#refs/tags/}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          if [ -z "$RELEASE_VERSION" ]; then
            echo "Unable to derive release version from tag '${{ inputs.tag }}'"
            exit 1
          fi
          export NIKCLI_VERSION="$RELEASE_VERSION"
          export VITE_NIKCLI_DESKTOP_VERSION="$RELEASE_VERSION"
          bun ./scripts/predev.ts
          bun x tsc -b
          bun x vite build

      # `bun run tauri build` runs the desktop "tauri" script. Its beforeBuildCommand
      # is skipped (frontend already built above); we only bundle here.
      # When a signing key is present we use the prod config so Tauri also emits the
      # auto-updater artifacts (+ .sig); otherwise we ship installers only.
      #
      # Apple Developer signing/notarization is not configured. Instead the macOS
      # bundles are ad-hoc signed (tauri.conf `macOS.signingIdentity: "-"`) so the
      # bundle seal — including the embedded `nikcli-cli` sidecar — is valid and
      # Apple Silicon no longer reports the app as "damaged". Downloaded builds are
      # still quarantined: users right-click → Open (or `xattr -dr
      # com.apple.quarantine Nikcli.app`) once. Revisit with Developer ID +
      # notarization once we have a stable keychain secret.
      - name: Build desktop app
        id: build
        working-directory: packages/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS bundles are ad-hoc signed (`macOS.signingIdentity: "-"` in the
          # Tauri config) — no Apple Developer cert. Do NOT wire APPLE_CERTIFICATE /
          # APPLE_SIGNING_IDENTITY here from (possibly missing) secrets: GitHub sets
          # an absent secret to an *empty string*, and Tauri treats a present-but-
          # empty APPLE_CERTIFICATE as "sign with a real cert", then dies on
          # `security import` of nothing. To enable Developer ID + notarization
          # later, add the APPLE_* secrets AND export them here only when non-empty
          # (e.g. via a guard step), never unconditionally.
          # `prepare:sidecar` (predev.ts) downloads the prebuilt CLI artifact
          # when this is set, instead of rebuilding it locally. Rebuilding the
          # CLI cross-platform on every desktop runner is fragile (Bin's bin
          # remap step fails on Windows with `could not create process`).
          CLI_ARTIFACT_RUN_ID: ${{ inputs.cli_run_id }}
          # `predev.ts` runs `gh run download` to fetch that prebuilt CLI artifact,
          # which needs an authenticated `gh` — without GH_TOKEN it exits with code 4.
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${{ inputs.tag }}"
          RELEASE_VERSION="${RELEASE_VERSION#refs/tags/}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          if [ -z "$RELEASE_VERSION" ]; then
            echo "Unable to derive release version from tag '${{ inputs.tag }}'"
            exit 1
          fi
          export NIKCLI_VERSION="$RELEASE_VERSION"
          CONFIG_ARGS=()
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "signing key present → prod config (updater artifacts)"
            CONFIG_ARGS=(--config src-tauri/tauri.prod.conf.json)
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "no signing key → base config (installers only)"
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi
          CONFIG_JSON="{\"version\":\"$RELEASE_VERSION\",\"build\":{\"beforeBuildCommand\":\"\"}}"
          bun run tauri build --target ${{ matrix.target }} "${CONFIG_ARGS[@]}" \
            --config "$CONFIG_JSON"

      - name: Collect & upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          BUNDLE="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          # Stage into a directory of our own: the repo already tracks an
          # `artifacts/` directory (artifacts/tui/**), so uploading `artifacts/*`
          # globbed that subdirectory and `gh release upload` failed with
          # "read artifacts/tui: is a directory" on every desktop target.
          # Keep this workspace-relative: RUNNER_TEMP is a backslash path on the
          # Windows runners, which Git Bash does not handle reliably.
          STAGE="desktop-artifacts"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          if [ -d "$BUNDLE" ]; then
            # Bundle targets: deb, rpm, dmg, nsis (.exe), app (zipped below).
            find "$BUNDLE" -type f \( \
              -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.exe" \
              \) -exec cp {} "$STAGE/" \;
            # macOS: also ship a zipped .app for parity with opencode's *.zip
            if [ -d "$BUNDLE/macos" ]; then
              for app in "$BUNDLE"/macos/*.app; do
                [ -d "$app" ] || continue
                name="$(basename "$app" .app)"
                (cd "$BUNDLE/macos" && zip -q -r -X "$ROOT/$STAGE/${name}-${{ matrix.target }}.zip" "$(basename "$app")")
              done
            fi
          fi
          ls -la "$STAGE" || true
          # Upload regular files only — `gh` rejects a directory argument. No
          # bash arrays here: the macOS runners still ship bash 3.2, where
          # expanding an empty array under `set -u` aborts the step.
          if [ "$(find "$STAGE" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" = "0" ]; then
            echo "no installers produced for ${{ matrix.target }} — nothing to upload"
          else
            find "$STAGE" -maxdepth 1 -type f \
              -exec gh release upload "${{ inputs.tag }}" --clobber --repo "$GITHUB_REPOSITORY" {} +
          fi

      # Tauri updater: rename the (arch-agnostic) macOS bundle, publish it, and
      # stash the signature + metadata so the finalize job can build latest.json.
      - name: Prepare updater fragment
        if: steps.build.outputs.updater == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUNDLE="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          SIG="$(find "$BUNDLE" -type f -name '*.sig' | head -1 || true)"
          if [ -z "$SIG" ]; then echo "no .sig produced — skipping updater fragment"; exit 0; fi
          ART="${SIG%.sig}"
          base="$(basename "$ART")"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)     KEY=darwin-aarch64;  ARCH=aarch64;;
            x86_64-apple-darwin)      KEY=darwin-x86_64;   ARCH=x64;;
            x86_64-pc-windows-msvc)   KEY=windows-x86_64;  ARCH=x64;;
            aarch64-pc-windows-msvc)  KEY=windows-aarch64; ARCH=arm64;;
            x86_64-unknown-linux-gnu) KEY=linux-x86_64;    ARCH=x64;;
            aarch64-unknown-linux-gnu)KEY=linux-aarch64;   ARCH=arm64;;
          esac
          # macOS .app.tar.gz has no arch in its name → make it unique per arch.
          case "$base" in
            *.app.tar.gz) newbase="Nikcli_${ARCH}.app.tar.gz";;
            *)            newbase="$base";;
          esac
          mkdir -p frag
          cp "$ART" "frag/$newbase"
          cp "$SIG" "frag/${newbase}.sig"
          printf '{"key":"%s","file":"%s"}' "$KEY" "$newbase" > frag/meta.json
          # Publish the (renamed) updater bundle so latest.json can point at it.
          gh release upload "${{ inputs.tag }}" "frag/$newbase" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload updater fragment artifact
        if: steps.build.outputs.updater == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updater-${{ matrix.target }}
          path: frag
          if-no-files-found: ignore

  # Assemble the Tauri latest.json manifest from the per-platform fragments.
  finalize-updater:
    needs: build
    if: (github.repository == 'nikomatt69/nikcli' || github.repository == 'nikcli/nikcli')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/setup-bun

      - name: Download updater fragments
        uses: actions/download-artifact@v7
        with:
          path: updater-fragments
          pattern: updater-*
        continue-on-error: true

      - name: Build & upload latest.json
        run: bun run script/finalize-updater.ts
        env:
          UPDATER_FRAGMENTS_DIR: updater-fragments
          GH_REPO: ${{ github.repository }}
          NIKCLI_VERSION: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.SST_GITHUB_TOKEN }}
